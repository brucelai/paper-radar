# ============================================================================
# paper-radar config — ML / Data Science / Computer Vision / Robotics / Textile
# 複製成 config.yaml 後填入自己的網域、email 與通知設定。
# ============================================================================

site:
  domain: paper-radar.example.com
  title: 技術研究雷達
  private: true
  access_email: you@example.com

ntfy:
  topic: paper-radar
  dry_run: false

enrich:
  unpaywall:
    enabled: true
    email: you@example.com
  inst_sfx:
    enabled: false
    base: "https://your-institution-sfx.example.com/SID"
    sid: paper-radar
    fulltext_section_markers: ["全文", "Full Text"]
    platform_labels: [ACM, IEEE, SpringerLink, ScienceDirect, Wiley]

fulltext_tiers:
  oa:          { badge: "🟢 OA",   fetch: host_auto }
  institution: { badge: "🏥 機構訂閱", fetch: pc_claude_chrome }
  paywalled:   { badge: "🔒 自取", fetch: manual_upload }

defaults:
  limit: 20
  new_days: 5
  source_quality:
    arxiv: 1
    openreview: 2
    openalex: 1
    crossref: 1
    semantic_scholar: 1
    dblp: 1
    rss: 2

topic_groups:
  ml:       { label: "Machine Learning", default_on: true }
  ds:       { label: "Data Science", default_on: true }
  cv:       { label: "Computer Vision", default_on: true }
  robotics: { label: "Robotics", default_on: true }
  textile:  { label: "Textile Engineering", default_on: true }

# ============================================================================
# FEEDS
#   rss              → direct RSS/Atom URL (including arXiv category feeds)
#   openalex         → OpenAlex Works API; use search/topics/filter parameters
#   crossref         → Crossref Works API; use query and filter parameters
#   semantic_scholar → Semantic Scholar paper search API
#   dblp             → dblp publication search API
#   openreview       → OpenReview API v2 invitation query
# ============================================================================
feeds:
  # ---- Machine Learning: arXiv category + OpenReview + OpenAlex ----
  - { key: arxiv_ml, group: ml, type: rss, name: "arXiv cs.LG", url: "https://rss.arxiv.org/rss/cs.LG" }
  - { key: openreview_neurips, group: ml, type: openreview, name: "OpenReview NeurIPS", invitation: "NeurIPS.cc/-/Submission" }
  - { key: openreview_iclr, group: ml, type: openreview, name: "OpenReview ICLR", invitation: "ICLR.cc/-/Submission" }
  - { key: openalex_ml, group: ml, type: openalex, name: "OpenAlex machine learning", search: "machine learning", filter: "from_publication_date:2023-01-01" }

  # ---- Data Science: topic constrained journal / proceedings metadata ----
  - { key: openalex_ds, group: ds, type: openalex, name: "OpenAlex data science", search: "data mining statistical learning analytics", filter: "from_publication_date:2023-01-01,type:article|proceedings-article" }
  - { key: crossref_ds, group: ds, type: crossref, name: "Crossref data science", query: "data mining statistical learning analytics", filter: "from-pub-date:2023-01-01,type:journal-article,type:proceedings-article" }
  - { key: dblp_ds, group: ds, type: dblp, name: "dblp data science", query: "data mining OR statistical learning" }

  # ---- Computer Vision: arXiv category + OpenReview + OpenAlex ----
  - { key: arxiv_cv, group: cv, type: rss, name: "arXiv cs.CV", url: "https://rss.arxiv.org/rss/cs.CV" }
  - { key: openreview_cvpr, group: cv, type: openreview, name: "OpenReview CVPR", invitation: "thecvf.com/CVPR/2026/Conference/-/Submission" }
  - { key: openalex_cv, group: cv, type: openalex, name: "OpenAlex computer vision", search: "computer vision", filter: "from_publication_date:2023-01-01" }

  # ---- Robotics: arXiv category + OpenReview + OpenAlex ----
  - { key: arxiv_robotics, group: robotics, type: rss, name: "arXiv cs.RO", url: "https://rss.arxiv.org/rss/cs.RO" }
  - { key: openreview_corl, group: robotics, type: openreview, name: "OpenReview CoRL", invitation: "robot-learning.org/CoRL/2025/Conference/-/Submission" }
  - { key: openalex_robotics, group: robotics, type: openalex, name: "OpenAlex robotics", search: "robotics autonomous systems control", filter: "from_publication_date:2023-01-01" }

  # ---- Textile: journal whitelist plus mandatory textile keyword matching ----
  - { key: textile_trj, group: textile, type: crossref, name: "Textile Research Journal", query: "Textile Research Journal", filter: "from-pub-date:2023-01-01,type:journal-article", textile_only: true }
  - { key: textile_jti, group: textile, type: crossref, name: "Journal of The Textile Institute", query: "Journal of The Textile Institute", filter: "from-pub-date:2023-01-01,type:journal-article", textile_only: true }
  - { key: textile_autex, group: textile, type: crossref, name: "AUTEX Research Journal", query: "AUTEX Research Journal", filter: "from-pub-date:2023-01-01,type:journal-article", textile_only: true }
  - { key: textile_openalex, group: textile, type: openalex, name: "OpenAlex textile engineering", search: "textile fiber fabric yarn weaving nonwoven smart textile", filter: "from_publication_date:2023-01-01", textile_only: true }
